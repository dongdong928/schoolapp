<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>출석 체크</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: 가운데 좁은 무대(키패드 중심 출석 입력) + 같은 폭의 관리자 패널. 면은 얇은 선과 옅은 그림자로만 구분한다. */
:root {
  --bg: #F2F3F8;
  --glow: #E3E7FB;
  --surface: #FFFFFF;
  --surface-2: #F6F7FB;
  --ink: #0E1322;
  --muted: #697186;
  --line: #E4E7EF;
  --accent: #3A4BDC;
  --accent-soft: #E9ECFD;
  --accent-ink: #FFFFFF;
  --ok: #0A8458;
  --ok-bg: #E0F4EB;
  --bad: #BF3A33;
  --bad-bg: #FCE8E6;
  --shadow: 0 1px 2px rgba(14, 19, 34, .04), 0 12px 32px -12px rgba(14, 19, 34, .12);
  --font-body: "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-num: "Space Grotesk", "Noto Sans KR", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #090C15; --glow: #151B3A; --surface: #121729; --surface-2: #181E33; --ink: #E9EDF7; --muted: #8E98B0; --line: #232A41;
    --accent: #8093FF; --accent-soft: #1D2547; --accent-ink: #0A0E1E; --ok: #4FD1A0; --ok-bg: #102F25; --bad: #FF8F87; --bad-bg: #36191A;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 32px -12px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #090C15; --glow: #151B3A; --surface: #121729; --surface-2: #181E33; --ink: #E9EDF7; --muted: #8E98B0; --line: #232A41;
  --accent: #8093FF; --accent-soft: #1D2547; --accent-ink: #0A0E1E; --ok: #4FD1A0; --ok-bg: #102F25; --bad: #FF8F87; --bad-bg: #36191A;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 32px -12px rgba(0, 0, 0, .6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg) radial-gradient(900px 380px at 50% -120px, var(--glow), transparent 70%) no-repeat;
  color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.wrap.wide { max-width: 760px; }

header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.mark { width: 40px; height: 40px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
.date { color: var(--muted); font-size: 13px; margin: 1px 0 0; }
.tabs { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
.tabs button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px; font-weight: 500; padding: 6px 16px; border-radius: 999px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 26px; box-shadow: var(--shadow); }
.status { font-size: 13px; color: var(--muted); margin: 0; }
.status:empty { display: none; }
.status.err { color: var(--bad); }

/* 학생 화면 */
.checkin { display: flex; flex-direction: column; gap: 16px; }
.checkin > label { font-size: 12px; font-weight: 500; letter-spacing: 0.1em; color: var(--muted); text-align: center; }
.num-input {
  font-family: var(--font-num); font-weight: 700; font-size: clamp(44px, 15vw, 64px); text-align: center;
  letter-spacing: 0.14em; font-variant-numeric: tabular-nums; width: 100%; padding: 6px 8px 14px; line-height: 1.1;
  border: 0; border-bottom: 2px solid var(--line); border-radius: 0; background: transparent; color: var(--ink); caret-color: var(--accent);
}
.num-input:focus { outline: none; border-bottom-color: var(--accent); }
.num-input::placeholder { color: var(--line); letter-spacing: 0.14em; }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.keypad button {
  font-family: var(--font-num); font-weight: 500; font-size: 24px; height: 58px; border: 0; border-radius: 16px;
  background: var(--surface-2); color: var(--ink); cursor: pointer; display: grid; place-items: center; touch-action: manipulation;
  transition: background-color .12s, transform .12s;
}
.keypad button:hover { background: var(--accent-soft); }
.keypad button:active { transform: scale(.96); }
.keypad button.fn { color: var(--muted); font-size: 14px; font-family: var(--font-body); font-weight: 500; }
.btn { font: inherit; font-weight: 700; border: 0; border-radius: 14px; padding: 12px 18px; cursor: pointer; background: var(--accent); color: var(--accent-ink); }
.btn:hover { filter: brightness(1.06); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.big { font-size: 17px; padding: 16px; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); font-weight: 500; padding: 5px 12px; font-size: 13px; border-radius: 999px; }
.btn.ghost:hover { border-color: var(--accent); color: var(--accent); filter: none; }
.btn.danger { color: var(--bad); }
.btn.danger:hover { border-color: var(--bad); color: var(--bad); }
.result { border-radius: 16px; padding: 16px 18px; display: flex; align-items: center; gap: 14px; }
.result[hidden] { display: none; }
.result.ok { background: var(--ok-bg); color: var(--ok); }
.result.err { background: var(--bad-bg); color: var(--bad); }
.result .big-name { font-size: 20px; font-weight: 700; line-height: 1.3; letter-spacing: -0.01em; }
.result .sub { font-size: 13px; opacity: .9; }
.result svg { flex: none; }
.stat { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; font-size: 13px; color: var(--muted); }
.stat .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.stat b { font-family: var(--font-num); font-variant-numeric: tabular-nums; color: var(--ink); font-size: 20px; }
.track { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.fill { height: 100%; border-radius: 999px; background: var(--ok); transition: width .4s ease; }

/* 관리자 화면 */
.admin { display: flex; flex-direction: column; gap: 18px; }
.bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.bar label { font-size: 12px; color: var(--muted); margin-right: 10px; letter-spacing: 0.06em; }
.field { font: inherit; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); color: var(--ink); min-width: 0; }
.field:focus { border-color: var(--accent); outline: none; background: var(--surface); box-shadow: 0 0 0 3px var(--accent-soft); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border-radius: 999px; padding: 4px 14px; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
h2 { margin: 0 0 14px; font-size: 14px; font-weight: 700; letter-spacing: 0.02em; }
.add { display: grid; grid-template-columns: 120px 1fr auto; gap: 12px; align-items: end; }
.add div { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.add label { font-size: 12px; color: var(--muted); }
.add .btn { padding: 11px 22px; }
.tablebox { overflow-x: auto; margin: 0 -8px; padding: 0 8px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: 0.1em; padding: 6px 10px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--surface-2); }
td.n { width: 64px; }
.badge { font-family: var(--font-num); font-weight: 700; font-variant-numeric: tabular-nums; min-width: 34px; height: 30px; padding: 0 8px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); display: inline-grid; place-items: center; }
td.name { font-weight: 500; }
td.acts { white-space: nowrap; text-align: right; }
td.acts .btn { margin-left: 6px; }
.pill { display: inline-block; border-radius: 999px; padding: 2px 11px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.time { color: var(--muted); font-size: 12px; margin-left: 8px; font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); padding: 22px 4px; margin: 0; text-align: center; }
.lockform { display: flex; flex-direction: column; gap: 12px; max-width: 320px; margin: 8px auto; }
.lockform h2 { text-align: center; font-size: 17px; margin: 0; }
.lockform .status { text-align: center; }
@media (max-width: 520px) {
  .add { grid-template-columns: 96px 1fr; }
  .add .btn { grid-column: 1 / -1; }
  .panel { padding: 20px; border-radius: 20px; }
}
@media (prefers-reduced-motion: no-preference) {
  .result { animation: pop .2s ease-out; }
  @keyframes pop { from { transform: translateY(4px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }
}
@media (prefers-reduced-motion: reduce) { .fill, .keypad button { transition: none; } }
</style>

<div class="wrap" id="wrap">
  <header>
    <div class="brand">
      <div class="mark" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M8.5 13l2.5 2.5 4.5-5"/></svg></div>
      <div>
        <h1>출석 체크</h1>
        <p class="date" id="today"></p>
      </div>
    </div>
    <div class="tabs" role="tablist" id="tabs" hidden>
      <button role="tab" id="tabStudent" aria-selected="true" type="button">출석</button>
      <button role="tab" id="tabAdmin" aria-selected="false" type="button">관리자</button>
    </div>
  </header>

  <p class="status" id="status" role="status"></p>

  <section id="viewStudent" class="panel">
    <form class="checkin" id="checkForm" autocomplete="off">
      <label for="num">출석 번호를 입력하세요</label>
      <input class="num-input" id="num" inputmode="none" pattern="[0-9]*" maxlength="9" placeholder="–" aria-describedby="result">
      <div class="keypad" id="keypad">
        <button type="button" data-k="1" aria-label="1">1</button>
        <button type="button" data-k="2" aria-label="2">2</button>
        <button type="button" data-k="3" aria-label="3">3</button>
        <button type="button" data-k="4" aria-label="4">4</button>
        <button type="button" data-k="5" aria-label="5">5</button>
        <button type="button" data-k="6" aria-label="6">6</button>
        <button type="button" data-k="7" aria-label="7">7</button>
        <button type="button" data-k="8" aria-label="8">8</button>
        <button type="button" data-k="9" aria-label="9">9</button>
        <button type="button" class="fn" data-k="clear" aria-label="모두 지우기">지우기</button>
        <button type="button" data-k="0" aria-label="0">0</button>
        <button type="button" class="fn" data-k="back" aria-label="한 글자 지우기"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 5H9l-6 7 6 7h11a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M14 9.5l4 5M18 9.5l-4 5"/></svg></button>
      </div>
      <button class="btn big" id="go" type="submit">출석하기</button>
      <div class="result" id="result" role="status" hidden></div>
    </form>
    <div class="stat" id="stat"></div>
  </section>

  <section id="viewAdmin" hidden>
    <div class="panel" id="lock">
      <form class="lockform" id="lockForm" autocomplete="off">
        <h2 id="lockTitle">관리자 비밀번호</h2>
        <p class="status" id="lockHint"></p>
        <input class="field" type="password" id="pw" autocomplete="off" aria-label="비밀번호" placeholder="비밀번호">
        <input class="field" type="password" id="pw2" autocomplete="off" aria-label="비밀번호 확인" placeholder="비밀번호 확인" hidden>
        <button class="btn" id="pwGo" type="submit">들어가기</button>
        <button class="btn ghost" id="pwReset" type="button" hidden>비밀번호 다시 설정</button>
        <p class="status err" id="lockMsg" role="status"></p>
      </form>
    </div>
    <div class="admin" id="adminBody" hidden>
    <div class="panel">
      <div class="bar">
        <div><label for="adminDate">날짜</label><input class="field" type="date" id="adminDate"></div>
        <div class="chips" id="chips"></div>
        <div class="chips">
          <button class="btn ghost" id="pwChange" type="button" hidden>비밀번호 변경</button>
          <button class="btn ghost" id="relock" type="button">잠그기</button>
        </div>
      </div>
    </div>
    <div class="panel">
      <h2>학생 등록</h2>
      <form class="add" id="addForm" autocomplete="off">
        <div><label for="addNum">출석 번호 (숫자)</label><input class="field" id="addNum" inputmode="numeric" pattern="[0-9]*" maxlength="9" placeholder="1"></div>
        <div><label for="addName">이름</label><input class="field" id="addName" maxlength="20" placeholder="홍길동"></div>
        <button class="btn" type="submit">추가</button>
      </form>
      <p class="status" id="adminMsg" role="status" style="margin-top:12px"></p>
    </div>
    <div class="panel">
      <h2>학생 명단</h2>
      <div class="tablebox" id="roster"></div>
    </div>
    </div>
  </section>
</div>

<script>
(async function () {
  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, "0");
  const dstr = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const todayStr = () => dstr(new Date());
  const normNum = (s) => String(s || "").replace(/\D/g, "").replace(/^0+/, "").slice(0, 9);
  const fmtTime = (t) => new Date(t).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", hour12: false });
  function h(tag, props, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (k === "class") e.className = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else if (v === true) e.setAttribute(k, "");
      else if (v !== false && v != null) e.setAttribute(k, v);
    }
    for (const c of kids.flat()) if (c != null && c !== false) e.append(c);
    return e;
  }
  function showDate() {
    $("today").textContent = new Date().toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric", weekday: "short" });
  }
  showDate();

  function setStatus(msg, isErr) { const s = $("status"); s.textContent = msg || ""; s.classList.toggle("err", !!isErr); }

  let db = null, isAdmin = false;
  try {
    // 플랫폼 연결 객체는 스크립트가 시작된 직후에는 아직 없을 수 있어서 잠시 기다린다.
    for (let i = 0; i < 80 && !window.claude; i++) await new Promise((r) => setTimeout(r, 100));
    db = window.claude ? await window.claude.use("db") : null;
    const user = window.claude ? await window.claude.use("user") : null;
    isAdmin = user ? await user.canEdit() : false;
  } catch (e) { db = null; }

  if (!db) {
    setStatus("출석 기록을 사용하려면 로그인한 상태로 이 페이지를 열어 주세요.", true);
    $("go").disabled = true;
    $("num").disabled = true;
    return;
  }

  $("tabs").hidden = false;

  // ----- 상태 -----
  let rosterMap = new Map();   // "번호" -> {number, name}
  let rosterReady = false;
  let attMap = new Map();      // "번호" -> {at, ...}
  let attReady = false;
  let mode = "student";
  let viewDate = todayStr();
  let unsubAtt = null;
  let editingId = null, editDraft = "", confirmId = null;
  let loadTimer = setTimeout(slowNote, 10000);
  let confirmed = { roster: false, att: false };

  function slowNote() { setStatus("데이터를 불러오는 중이에요. 연결이 느리면 최신 정보가 아닐 수 있어요."); }
  function checkConfirmed() {
    if (confirmed.roster && confirmed.att) { clearTimeout(loadTimer); setStatus(""); }
  }

  const sortedRoster = () => [...rosterMap.values()].sort((a, b) => a.number - b.number);

  // ----- 구독 -----
  db.collection("roster").onSnapshot((snap) => {
    const m = new Map();
    snap.docs.forEach((d) => {
      const v = d.data() || {};
      if (typeof v.number === "number" && typeof v.name === "string") m.set(String(v.number), { number: v.number, name: v.name });
    });
    rosterMap = m; rosterReady = true;
    if (!snap.metadata.fromCache) { confirmed.roster = true; checkConfirmed(); }
    render();
  }, (e) => { setStatus("학생 명단을 불러오지 못했어요. 페이지를 다시 열어 주세요.", true); });

  function subscribeAtt() {
    if (unsubAtt) unsubAtt();
    attReady = false; confirmed.att = false; attMap = new Map();
    const date = viewDate;
    unsubAtt = db.collection("attendance").where("date", "==", date).onSnapshot((snap) => {
      if (date !== viewDate) return;
      const m = new Map();
      snap.docs.forEach((d) => { const v = d.data() || {}; if (typeof v.number === "number") m.set(String(v.number), v); });
      attMap = m; attReady = true;
      if (!snap.metadata.fromCache) { confirmed.att = true; checkConfirmed(); }
      render();
    }, () => { setStatus("출석 기록을 불러오지 못했어요. 페이지를 다시 열어 주세요.", true); });
  }
  subscribeAtt();

  function setViewDate(d) { if (d !== viewDate) { viewDate = d; subscribeAtt(); } }

  // 자정이 지나면 학생 화면의 날짜를 바꾼다
  setInterval(() => {
    showDate();
    if (mode === "student" && todayStr() !== viewDate) setViewDate(todayStr());
  }, 30000);

  // ----- 관리자 비밀번호 -----
  // 비밀번호는 PBKDF2로 해시해 config/admin 문서에 저장한다. 설정과 변경은 편집 권한이 있는 계정만 할 수 있다.
  let cfg = null, cfgReady = false, unlocked = false, resetting = false, fails = 0, lockedUntil = 0;
  const hex = (b) => [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, "0")).join("");
  async function derive(pw, saltHex, iter) {
    const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
    const salt = Uint8Array.from(saltHex.match(/../g).map((x) => parseInt(x, 16)));
    return hex(await crypto.subtle.deriveBits({ name: "PBKDF2", salt, iterations: iter, hash: "SHA-256" }, key, 256));
  }
  db.doc("config/admin").onSnapshot((s) => {
    const v = s.exists ? s.data() : null;
    cfg = v && typeof v.hash === "string" && typeof v.salt === "string" ? v : null;
    cfgReady = true;
    if (mode === "admin") updateLockView();
  }, () => {});

  function lockMode() {
    if (!cfgReady) return "loading";
    if (!cfg) return isAdmin ? "setup" : "none";
    return resetting && isAdmin ? "setup" : "enter";
  }
  function updateLockView() {
    $("lock").hidden = unlocked;
    $("adminBody").hidden = !unlocked;
    $("pwChange").hidden = !isAdmin;
    if (unlocked) return;
    const m = lockMode();
    const setup = m === "setup";
    $("lockTitle").textContent = setup ? "관리자 비밀번호 만들기" : "관리자 비밀번호";
    $("lockHint").textContent = m === "loading" ? "확인하는 중이에요." : m === "none" ? "관리자가 아직 비밀번호를 설정하지 않았어요." : setup ? "4자 이상으로 정해 주세요." : "";
    $("pw").hidden = m === "loading" || m === "none";
    $("pw2").hidden = !setup;
    $("pwGo").hidden = m === "loading" || m === "none";
    $("pwGo").textContent = setup ? "저장하고 들어가기" : "들어가기";
    $("pwReset").hidden = !(isAdmin && cfg && m !== "loading");
    $("pwReset").textContent = setup ? "취소" : "비밀번호 다시 설정";
  }
  $("pwReset").addEventListener("click", () => { resetting = !resetting; $("lockMsg").textContent = ""; $("pw").value = ""; $("pw2").value = ""; updateLockView(); });
  $("pwChange").addEventListener("click", () => { unlocked = false; resetting = true; $("pw").value = ""; $("pw2").value = ""; render(); $("pw").focus(); });
  $("relock").addEventListener("click", () => { unlocked = false; resetting = false; $("pw").value = ""; $("pw2").value = ""; adminMsg(""); render(); });
  $("lockForm").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const msg = $("lockMsg"); msg.textContent = "";
    const m = lockMode();
    const pw = $("pw").value;
    try {
      if (m === "enter") {
        if (Date.now() < lockedUntil) { msg.textContent = "잠시 뒤에 다시 시도해 주세요."; return; }
        if (!pw) { msg.textContent = "비밀번호를 입력해 주세요."; return; }
        const hsh = await derive(pw, cfg.salt, cfg.iter || 100000);
        if (hsh === cfg.hash) { fails = 0; unlocked = true; $("pw").value = ""; render(); }
        else {
          fails++; lockedUntil = Date.now() + Math.min(fails, 6) * 1000;
          msg.textContent = "비밀번호가 맞지 않아요."; $("pw").select();
        }
      } else if (m === "setup") {
        if (pw.length < 4) { msg.textContent = "비밀번호는 4자 이상이어야 해요."; return; }
        if (pw !== $("pw2").value) { msg.textContent = "두 비밀번호가 서로 달라요."; return; }
        const salt = hex(crypto.getRandomValues(new Uint8Array(16)));
        const iter = 100000;
        await db.doc("config/admin").set({ salt, iter, hash: await derive(pw, salt, iter) });
        resetting = false; unlocked = true; $("pw").value = ""; $("pw2").value = ""; render();
      }
    } catch (e) {
      msg.textContent = e && e.code === "invalid_argument" ? "비밀번호를 저장할 권한이 없어요. 편집 권한이 있는 계정으로 열어 주세요." : "처리하지 못했어요. 잠시 뒤에 다시 시도해 주세요.";
    }
  });

  // ----- 탭 -----
  function setMode(m) {
    mode = m;
    if (m === "student") { unlocked = false; resetting = false; }
    $("tabStudent").setAttribute("aria-selected", m === "student");
    $("tabAdmin").setAttribute("aria-selected", m === "admin");
    $("viewStudent").hidden = m !== "student";
    $("viewAdmin").hidden = m !== "admin";
    $("wrap").classList.toggle("wide", m === "admin");
    setViewDate(m === "student" ? todayStr() : ($("adminDate").value || todayStr()));
    render();
  }
  $("tabStudent").addEventListener("click", () => setMode("student"));
  $("tabAdmin").addEventListener("click", () => setMode("admin"));
  $("adminDate").value = todayStr();
  $("adminDate").addEventListener("change", () => {
    if (!$("adminDate").value) $("adminDate").value = todayStr();
    setViewDate($("adminDate").value); render();
  });

  // ----- 학생: 출석 -----
  const okIcon = '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>';
  const errIcon = '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 7v6M12 16.5v.5"/></svg>';
  function showResult(kind, title, sub) {
    const r = $("result");
    r.className = "result " + kind;
    r.hidden = false;
    r.replaceChildren();
    const ic = document.createElement("span"); ic.innerHTML = kind === "ok" ? okIcon : errIcon;
    r.append(ic, h("div", null, h("div", { class: "big-name" }, title), sub ? h("div", { class: "sub" }, sub) : null));
  }
  $("keypad").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-k]");
    if (!b) return;
    const inp = $("num"), k = b.dataset.k;
    if (k === "clear") inp.value = "";
    else if (k === "back") inp.value = inp.value.slice(0, -1);
    else if (inp.value.length < 9) inp.value += k;
    $("result").hidden = true;
  });
  $("num").addEventListener("input", (e) => {
    const v = e.target.value.replace(/\D/g, "");
    if (v !== e.target.value) e.target.value = v;
    $("result").hidden = true;
  });

  let busy = false;
  $("checkForm").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    if (busy) return;
    const n = normNum($("num").value);
    if (!n) return showResult("err", "번호를 입력해 주세요", "출석 번호는 숫자만 입력할 수 있어요.");
    if (!rosterReady) return showResult("err", "명단을 불러오는 중이에요", "잠시 뒤에 다시 눌러 주세요.");
    const stu = rosterMap.get(n);
    if (!stu) return showResult("err", "등록되지 않은 번호예요", "번호를 다시 확인하거나 관리자에게 문의하세요.");
    busy = true; $("go").disabled = true;
    try {
      const date = todayStr();
      const ref = db.doc("attendance/" + date + "_" + n);
      const cur = await ref.get();
      if (cur.exists) {
        const v = cur.data() || {};
        showResult("ok", stu.name + " 님", "이미 출석했어요" + (v.at ? " · " + fmtTime(v.at) : ""));
      } else {
        const at = Date.now();
        await ref.set({ date, number: Number(n), name: stu.name, at });
        showResult("ok", stu.name + " 님", "출석이 완료됐어요 · " + fmtTime(at));
      }
      $("num").value = "";
    } catch (e) {
      if (e && e.code === "invalid_argument") showResult("err", "출석 권한이 없어요", "이 페이지가 '참여자(Contributor)' 권한으로 공유되어야 출석할 수 있어요.");
      else showResult("err", "출석을 저장하지 못했어요", "잠시 뒤에 다시 시도해 주세요.");
    } finally {
      busy = false; $("go").disabled = false; $("num").focus();
    }
  });

  // ----- 관리자 -----
  function adminMsg(msg, isErr) { const s = $("adminMsg"); s.textContent = msg || ""; s.classList.toggle("err", !!isErr); }
  function writeErr(e) {
    adminMsg(e && e.code === "invalid_argument" ? "저장할 권한이 없어요. 공유 권한이 '참여자(Contributor)' 이상이어야 해요." : "저장하지 못했어요. 잠시 뒤에 다시 시도해 주세요.", true);
  }
  $("addNum").addEventListener("input", (e) => { e.target.value = e.target.value.replace(/\D/g, ""); });
  $("addForm").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const n = normNum($("addNum").value);
    const name = $("addName").value.trim();
    if (!n) return adminMsg("출석 번호를 1 이상의 숫자로 입력해 주세요.", true);
    if (!name) return adminMsg("이름을 입력해 주세요.", true);
    if (rosterMap.has(n)) return adminMsg(n + "번은 이미 " + rosterMap.get(n).name + " 님이 사용 중이에요. 이름을 바꾸려면 명단에서 '수정'을 누르세요.", true);
    try {
      await db.doc("roster/" + n).set({ number: Number(n), name });
      adminMsg(n + "번 " + name + " 님을 추가했어요.");
      $("addNum").value = ""; $("addName").value = ""; $("addNum").focus();
    } catch (e) { writeErr(e); }
  });

  async function saveEdit(n) {
    const name = editDraft.trim();
    if (!name) return adminMsg("이름을 입력해 주세요.", true);
    try { await db.doc("roster/" + n).update({ name }); editingId = null; adminMsg("이름을 수정했어요."); render(); }
    catch (e) { writeErr(e); }
  }
  async function removeStudent(n) {
    try { await db.doc("roster/" + n).delete(); confirmId = null; adminMsg(n + "번을 명단에서 삭제했어요."); render(); }
    catch (e) { writeErr(e); }
  }
  async function toggleAtt(stu) {
    const key = String(stu.number);
    const ref = db.doc("attendance/" + viewDate + "_" + key);
    try {
      if (attMap.has(key)) await ref.delete();
      else await ref.set({ date: viewDate, number: stu.number, name: stu.name, at: Date.now(), manual: true });
      adminMsg("");
    } catch (e) { writeErr(e); }
  }

  // ----- 렌더 -----
  function render() {
    renderStat();
    if (mode === "admin") { updateLockView(); if (unlocked) renderAdmin(); }
  }
  function renderStat() {
    const stat = $("stat");
    stat.replaceChildren();
    if (!rosterReady) return;
    if (rosterMap.size === 0) { stat.append(h("div", { class: "row" }, "아직 등록된 학생이 없어요. 관리자가 명단을 먼저 등록해야 해요.")); return; }
    const present = sortedRoster().filter((s) => attMap.has(String(s.number))).length;
    const pct = attReady ? Math.round((present / rosterMap.size) * 100) : 0;
    stat.append(
      h("div", { class: "row" }, h("span", null, "오늘 출석"), h("span", null, h("b", null, attReady ? present : "–"), " / " + rosterMap.size + "명")),
      h("div", { class: "track", "aria-hidden": "true" }, h("div", { class: "fill", style: "width:" + pct + "%" })));
  }
  function renderAdmin() {
    const list = sortedRoster();
    const present = list.filter((s) => attMap.has(String(s.number))).length;
    const chips = $("chips");
    chips.replaceChildren(
      h("span", { class: "chip ok" }, "출석 " + (attReady ? present : "–")),
      h("span", { class: "chip bad" }, "결석 " + (attReady ? list.length - present : "–"))
    );
    const box = $("roster");
    const hadFocus = document.activeElement && document.activeElement.id === "editName";
    box.replaceChildren();
    if (!rosterReady) { box.append(h("p", { class: "empty" }, "명단을 불러오는 중이에요.")); return; }
    if (list.length === 0) { box.append(h("p", { class: "empty" }, "등록된 학생이 없어요. 위에서 출석 번호와 이름을 추가하면 여기에 표시돼요.")); return; }
    const rows = list.map((s) => {
      const key = String(s.number);
      const a = attMap.get(key);
      const nameCell = editingId === key
        ? h("input", { class: "field", id: "editName", value: editDraft, maxlength: "20", "aria-label": key + "번 이름",
            onclick: (e) => e.stopPropagation(),
            oninput: (e) => { editDraft = e.target.value; },
            onkeydown: (e) => { if (e.key === "Enter") saveEdit(key); if (e.key === "Escape") { editingId = null; render(); } } })
        : s.name;
      let acts;
      if (editingId === key) {
        acts = [h("button", { class: "btn ghost", type: "button", onclick: () => saveEdit(key) }, "저장"),
                h("button", { class: "btn ghost", type: "button", onclick: () => { editingId = null; render(); } }, "취소")];
      } else if (confirmId === key) {
        acts = [h("button", { class: "btn ghost danger", type: "button", onclick: () => removeStudent(key) }, "삭제할까요?"),
                h("button", { class: "btn ghost", type: "button", onclick: () => { confirmId = null; render(); } }, "취소")];
      } else {
        acts = [h("button", { class: "btn ghost", type: "button", onclick: () => toggleAtt(s) }, a ? "출석 취소" : "출석 처리"),
                h("button", { class: "btn ghost", type: "button", onclick: () => { editingId = key; editDraft = s.name; confirmId = null; render(); } }, "수정"),
                h("button", { class: "btn ghost danger", type: "button", onclick: () => { confirmId = key; editingId = null; render(); } }, "삭제")];
      }
      return h("tr", null,
        h("td", { class: "n" }, h("span", { class: "badge" }, key)),
        h("td", { class: "name" }, nameCell),
        h("td", null, a ? h("span", { class: "pill ok" }, "출석") : h("span", { class: "pill bad" }, "결석"), a && a.at ? h("span", { class: "time" }, fmtTime(a.at)) : null),
        h("td", { class: "acts" }, acts));
    });
    box.append(h("table", null,
      h("thead", null, h("tr", null, h("th", null, "번호"), h("th", null, "이름"), h("th", null, "상태"), h("th", null, ""))),
      h("tbody", null, rows)));
    if (hadFocus) { const i = $("editName"); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }
  }

  render();
  $("num").focus();
})();
</script>

</body></html>
